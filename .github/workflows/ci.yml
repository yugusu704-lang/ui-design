name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'builder/package-lock.json'

      - name: Run root tests
        run: node --test tests/*.test.cjs

      - name: Install builder dependencies
        working-directory: builder
        run: npm ci

      - name: Run builder test suite
        working-directory: builder
        run: npm test

      - name: Typecheck and build builder
        working-directory: builder
        run: npm run build

      - name: Verify standalone export
        working-directory: builder
        run: npm run check:export
